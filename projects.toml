# BuzzYbis Projects Configuration
# Configure ONLY the repositories you want to track and publish.

[settings]
# Directory where generated project HTML pages are stored (outside the repository)
# Configured outside the site repository and generated from this file in production.
projects_dir = "../buzzybis_projects"
# Periodic polling interval in seconds when running with --watch (default: 300)
poll_interval = 300

[os-ads]
title = "Omnium Scientia — Algorithm & Data Structure"
description = "This book is the algorithms and data structures curriculum of the Omnium Scientia project, an initiative dedicated to creating free computer science learning materials. It builds a rigorous foundation from first principles, covering the essential algorithms, data structures, and problem-solving techniques needed to become a proficient software engineer. See more in the post about this curriculum."
collaborators = ["BuzzYbis"]
repo = "https://github.com/Omnium-Scientia/A-DS"
tags = ["alg", "data structure", "learning", "theory"]
